name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      # 要数据库的测试（#[sqlx::test]）每个测试自己建一个临时库，用完删掉
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 系统工具
        # poppler-utils：简历 PDF 转图片（pdftoppm、pdftotext）
        # ffmpeg：合并录像分片、抽帧
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # 需要真模型、真 TTS 的测试标了 #[ignore]，这里不跑
        run: cargo test --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # 前端的接口类型由后端的 OpenAPI 文档生成，所以这里也要编译后端
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成 OpenAPI 文档
        working-directory: .
        run: |
          cargo run --quiet -p interview-server -- openapi > "$RUNNER_TEMP/openapi.json"
          echo "OPENAPI_JSON=$RUNNER_TEMP/openapi.json" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 测试
        run: pnpm test
      - name: 构建
        run: pnpm build

  # 语音识别的真后端在可选特性后面，上面的 rust 任务编不到它，这里单独检查，并用真模型跑一遍
  stt-sherpa:
    name: stt-sherpa
    runs-on: ubuntu-latest
    env:
      AI_INTERVIEW_STT_MODEL_DIR: ${{ github.workspace }}/.stt-models
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stt-sherpa
      - name: clippy
        run: cargo clippy -p interview-stt --all-targets --features sherpa -- -D warnings
      - name: 模型缓存
        uses: actions/cache@v4
        with:
          path: .stt-models
          key: stt-models-${{ hashFiles('crates/interview-stt/scripts/download-models.sh') }}
      - name: 下载模型
        run: crates/interview-stt/scripts/download-models.sh
      - name: test
        # 模型在 CPU 上跑，不花钱，所以这里连标了 #[ignore] 的真模型测试一起跑
        run: cargo test -p interview-stt --features sherpa -- --include-ignored

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 音频、权重、密钥、个人信息不进 Git
        run: scripts/verify-repo-hygiene.sh
      - name: shell 语法
        run: |
          for f in scripts/*.sh crates/*/scripts/*.sh; do bash -n "$f"; done

  # 总闸：分支保护只需要把这一条设成必过。新加的 job 要加进 needs，否则它红了也挡不住合并。
  all-checks-passed:
    name: all-checks-passed
    if: always()
    needs: [rust, web, stt-sherpa, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: 上面的 job 都要通过
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各 job 结果：$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::有检查没通过"
              exit 1
            fi
          done
