name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      # 要数据库的测试（#[sqlx::test]）每个测试自己建一个临时库，用完删掉
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 系统工具
        # poppler-utils：简历 PDF 转图片（pdftoppm、pdftotext）
        # ffmpeg：合并录像分片、抽帧
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # 需要真模型、真 TTS 的测试标了 #[ignore]，这里不跑
        run: cargo test --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # 前端的接口类型由后端的 OpenAPI 文档生成，所以这里也要编译后端
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成 OpenAPI 文档
        working-directory: .
        run: |
          cargo run --quiet -p interview-server -- openapi > "$RUNNER_TEMP/openapi.json"
          echo "OPENAPI_JSON=$RUNNER_TEMP/openapi.json" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 测试
        run: pnpm test
      - name: 构建
        run: pnpm build

  # 候选人面试页的浏览器测试：真的 Chromium 加假的摄像头和麦克风，对着真的后端走完整场面试。
  # 后端、面试页、接口约定任何一边改坏了，只有这里看得出来。
  candidate-e2e:
    name: candidate-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # PR 上检出的是合并提交，多取一层才能和它的第一个父提交（目标分支）比出改了哪些文件
          fetch-depth: 2
      - name: 这次改动要不要跑
        id: scope
        # 只改了文档、语音引擎清单这类东西的 PR 不用跑。跳过时这个 job 照样算通过，不卡总闸。
        # 推到 main 的每次都跑。
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            pattern='^(crates/|migrations/|Cargo\.(toml|lock)$|web/(apps/candidate|packages)/|web/[^/]+$|scripts/dev-db\.sh$|\.github/workflows/ci\.yml$)'
            git diff --name-only HEAD^1 HEAD | grep -Eq "$pattern" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "要不要跑：$run"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
      - name: 系统工具
        if: steps.scope.outputs.run == 'true'
        # ffmpeg：合并录像分片、从分片里取声音；ffprobe 用来检查录出来的文件有画面有声音
        # PostgreSQL：测试用 scripts/dev-db.sh 自己起一个实例，和本机跑法一样。runner 自带，没有再装
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ls /usr/lib/postgresql/*/bin/pg_ctl >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends postgresql
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Playwright 版本
        if: steps.scope.outputs.run == 'true'
        id: playwright
        working-directory: web/apps/candidate
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 浏览器缓存
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 安装浏览器
        if: steps.scope.outputs.run == 'true'
        working-directory: web/apps/candidate
        # 浏览器本身有缓存就不再下载，它依赖的系统库每次都要装
        run: pnpm exec playwright install --with-deps chromium
      - name: 编译后端
        if: steps.scope.outputs.run == 'true'
        # 测试自己也会编译（e2e/backend.sh），先编译好，编译错误在这一步就看得到
        run: cargo build -p interview-server && cargo build -p interview-room --example demo
      - name: 浏览器测试
        if: steps.scope.outputs.run == 'true'
        working-directory: web/apps/candidate
        run: pnpm e2e
      - name: 留下失败时的截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-e2e-results
          path: web/apps/candidate/e2e-results
          retention-days: 7
          if-no-files-found: ignore

  # 语音识别的真后端在可选特性后面，上面的 rust 任务编不到它，这里单独检查，并用真模型跑一遍
  stt-sherpa:
    name: stt-sherpa
    runs-on: ubuntu-latest
    env:
      AI_INTERVIEW_STT_MODEL_DIR: ${{ github.workspace }}/.stt-models
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stt-sherpa
      - name: sherpa-onnx 预编译库
        # 放在 target/ 外面，原因见脚本开头的说明
        run: |
          line="$(crates/interview-stt/scripts/fetch-sherpa-lib.sh --extract)"
          echo "${line#export }" >> "$GITHUB_ENV"
      - name: clippy
        run: cargo clippy -p interview-stt --all-targets --features sherpa -- -D warnings
      - name: 模型缓存
        uses: actions/cache@v4
        with:
          path: .stt-models
          key: stt-models-${{ hashFiles('crates/interview-stt/scripts/download-models.sh') }}
      - name: 下载模型
        run: crates/interview-stt/scripts/download-models.sh
      - name: 系统依赖
        # ffmpeg：现场转写的测试要把录像分片解成音频
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: test
        # 模型在 CPU 上跑，不花钱，所以这里连标了 #[ignore] 的真模型测试一起跑
        run: cargo test -p interview-stt --features sherpa -- --include-ignored

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 音频、权重、密钥、个人信息不进 Git
        run: scripts/verify-repo-hygiene.sh
      - name: shell 语法
        run: |
          for f in scripts/*.sh crates/*/scripts/*.sh; do bash -n "$f"; done
      - name: Python 语法
        run: python3 -m py_compile tts/worker/*.py crates/interview-stt/bench/*.py

  # 总闸：分支保护只需要把这一条设成必过。新加的 job 要加进 needs，否则它红了也挡不住合并。
  all-checks-passed:
    name: all-checks-passed
    if: always()
    needs: [rust, web, candidate-e2e, stt-sherpa, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: 上面的 job 都要通过
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各 job 结果：$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::有检查没通过"
              exit 1
            fi
          done
