[package]
name = "interview-stt"
description = "AI 面试的语音识别：带逐字时间戳的转写"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 真的识别后端（sherpa-onnx 进程内跑 X-ASR）。默认不开：它编译时要下载约 23 MB 的预编译库，
# 不开时只有假后端，其他 crate 的编译和测试不受影响。
sherpa = ["dep:sherpa-onnx"]

[dependencies]
async-trait.workspace = true
interview-audio.workspace = true
serde.workspace = true
sherpa-onnx = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
anyhow.workspace = true
futures-util.workspace = true
interview-llm.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "transcribe"
required-features = ["sherpa"]

[[example]]
name = "realtime_latency"
required-features = ["sherpa"]

[[test]]
name = "sherpa_live"
required-features = ["sherpa"]

[lints]
workspace = true
